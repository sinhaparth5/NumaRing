<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="640" height="180" role="img" aria-label="NumaRing logo">
  <title>NumaRing</title>

  <g transform="translate(14,6)" stroke-linecap="round">
    <!-- Node 0 ring buffer -->
    <circle cx="42" cy="42" r="30" fill="none" stroke="#2563EB" stroke-width="9"/>
    <g stroke="#2563EB" stroke-width="3">
      <line x1="78.0" y1="42.0" x2="85.0" y2="42.0"/>
      <line x1="67.5" y1="67.5" x2="72.4" y2="72.4"/>
      <line x1="42.0" y1="78.0" x2="42.0" y2="85.0"/>
      <line x1="16.5" y1="67.5" x2="11.6" y2="72.4"/>
      <line x1="6.0"  y1="42.0" x2="-1.0" y2="42.0"/>
      <line x1="16.5" y1="16.5" x2="11.6" y2="11.6"/>
      <line x1="42.0" y1="6.0"  x2="42.0" y2="-1.0"/>
      <line x1="67.5" y1="16.5" x2="72.4" y2="11.6"/>
    </g>

    <!-- Node 1 ring buffer -->
    <circle cx="118" cy="118" r="30" fill="none" stroke="#D97706" stroke-width="9"/>
    <g stroke="#D97706" stroke-width="3">
      <line x1="154.0" y1="118.0" x2="161.0" y2="118.0"/>
      <line x1="143.5" y1="143.5" x2="148.4" y2="148.4"/>
      <line x1="118.0" y1="154.0" x2="118.0" y2="161.0"/>
      <line x1="92.5"  y1="143.5" x2="87.6"  y2="148.4"/>
      <line x1="82.0"  y1="118.0" x2="75.0"  y2="118.0"/>
      <line x1="92.5"  y1="92.5"  x2="87.6"  y2="87.6"/>
      <line x1="118.0" y1="82.0"  x2="118.0" y2="75.0"/>
      <line x1="143.5" y1="92.5"  x2="148.4" y2="87.6"/>
    </g>

    <!-- batched work-stealing connector -->
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
      </marker>
    </defs>
    <line x1="66.7" y1="66.7" x2="93.3" y2="93.3" stroke="#475569" stroke-width="5"
          marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>

  <text x="212" y="112" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="66" font-weight="700" letter-spacing="0" fill="#0F172A">Numa</text>
  <text x="422" y="112" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="66" font-weight="700" letter-spacing="0" fill="#2563EB">Ring</text>
</svg>
